name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'
      target:
        description: 'Deploy target'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # push to main → production (unchanged behaviour)
      # workflow_dispatch with target=production → production, but only from main
      # workflow_dispatch with target=staging (default) → staging Pages project only
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.target }}" = "production" ]; then
            # Guard: only main may deploy to production. Prevents a stale-branch
            # dispatch from overwriting the live site and the live product-sync worker.
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "env=production" >> $GITHUB_OUTPUT
            else
              echo "Refusing production deploy from ref '${{ github.ref_name }}' — falling back to staging"
              echo "env=staging" >> $GITHUB_OUTPUT
            fi
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      # Staging reads the staging product-sync worker (hercules-product-sync), the one
      # staging.hercules-merchandise.de is built against. Read-only: the staging lane
      # deploys no worker at all, only the hercules-de-staging Pages project.
      - name: Build Astro site (staging)
        if: steps.target.outputs.env == 'staging'
        run: npm run build
        env:
          WORKER_URL: https://hercules-product-sync.gilles-86d.workers.dev
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          PUBLIC_IS_STAGING: 'true'

      - name: Build Astro site (production)
        if: steps.target.outputs.env == 'production'
        run: npm run build
        env:
          WORKER_URL: https://hercules-product-sync-live.gilles-86d.workers.dev
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          PUBLIC_IS_STAGING: 'false'

      # Fail closed before anything ships. The staging artifact must be unindexable on
      # every host that can serve it, including hercules-de-staging.pages.dev, which
      # sits in front of no edge router and so gets no hostname-based noindex. The
      # inverse gate stops a staging noindex from ever reaching the live site: both
      # targets build from the same source tree.
      - name: Verify artifact indexability
        run: |
          set -u
          target='${{ steps.target.outputs.env }}'
          total=$(find dist -name '*.html' | wc -l | tr -d ' ')
          if [ "$total" -eq 0 ]; then
            echo "::error::dist/ contains no HTML — refusing to deploy"
            exit 1
          fi
          echo "Scanning $total HTML file(s) for target '$target'"

          if [ "$target" = 'staging' ]; then
            missing=$(grep -rLF '<meta name="robots" content="noindex' --include='*.html' dist || true)
            if [ -n "$missing" ]; then
              echo "::error::staging artifact has indexable pages — PUBLIC_IS_STAGING is not reaching the build"
              echo "$missing" | head -20
              exit 1
            fi
            echo "OK: all $total staging page(s) are noindex"
          else
            for p in dist/index.html dist/ueber-uns/index.html; do
              if [ ! -f "$p" ]; then
                echo "::error::expected production page missing from artifact: $p"
                exit 1
              fi
              if ! grep -qF 'content="index, follow' "$p"; then
                echo "::error::production page is not indexable — a staging noindex reached the production build: $p"
                grep -oE '<meta name="robots"[^>]*>' "$p" || true
                exit 1
              fi
            done
            if grep -qxF 'Disallow: /' dist/robots.txt; then
              echo "::error::production robots.txt carries a site-wide 'Disallow: /'"
              exit 1
            fi
            echo "OK: production artifact is indexable"
          fi

      - name: Deploy Product Sync Worker
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/product-sync/wrangler.toml --env production

      # hercules-product-sync-live is the worker WordPress actually calls: every
      # DE mu-plugin webhook and the Astro build's WORKER_URL point at it, and it
      # holds the GITHUB_TOKEN / WC / webhook secrets. The --env production step
      # above deploys hercules-product-sync-live-production, which nothing calls
      # and which has no secrets, so without this step CI never updates the live
      # worker — it was last deployed by hand on 2026-07-02.
      - name: Deploy Product Sync Worker (live)
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/product-sync/wrangler.toml

      - name: Deploy to Cloudflare Pages
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=hercules-de-live

      - name: Deploy to Staging
        if: steps.target.outputs.env == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=hercules-de-staging --branch=main

      - name: Output deployment URL
        run: |
          if [ "${{ steps.target.outputs.env }}" = "production" ]; then
            echo "Deployed to https://hercules-de-live.pages.dev (production)"
          else
            echo "Deployed to https://hercules-de-staging.pages.dev (staging)"
          fi

      - name: Trigger post-deploy health check
        if: success() && steps.target.outputs.env == 'production'
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.HEALTH_CHECK_TOKEN }}" \
            https://api.github.com/repos/royboy31/hercules-health-check/dispatches \
            -d '{"event_type":"deploy-de"}' || true
