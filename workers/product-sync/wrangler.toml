name = "hercules-product-sync-live"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV namespace for product data (Gilles's account)
[[kv_namespaces]]
binding = "PRODUCTS_KV"
id = "9eb4cfdf0e0d4636ad728eeb0ee30557"
preview_id = "d063f9226fb448efb168b81562eb45dd"

# R2 bucket for product images (optional - enable in Cloudflare dashboard first)
# [[r2_buckets]]
# binding = "PRODUCTS_BUCKET"
# bucket_name = "hercules-products"

[triggers]
crons = ["0 5 * * *"]

# Environment variables (set via wrangler secret)
[vars]
WC_STORE_URL = "https://hercules-merchandise.de"
ASTRO_SITE_URL = "https://hercules-de-live.pages.dev"

# Staging environment — deploys to hercules-product-sync.gilles-86d.workers.dev
# Used by staging.hercules-merchandise.de (Astro build hardcodes this URL)
[env.staging]
name = "hercules-product-sync"
vars = { WC_STORE_URL = "https://staging.hercules-merchandise.de", ASTRO_SITE_URL = "https://hercules-de-live.pages.dev" }

[[env.staging.kv_namespaces]]
binding = "PRODUCTS_KV"
id = "9eb4cfdf0e0d4636ad728eeb0ee30557"

# Development environment
[env.dev]
vars = { WC_STORE_URL = "https://staging.hercules-merchandise.de" }

# Production environment
[env.production]
vars = { WC_STORE_URL = "https://hercules-merchandise.de", ASTRO_SITE_URL = "https://hercules-de-live.pages.dev" }

[[env.production.kv_namespaces]]
binding = "PRODUCTS_KV"
id = "9eb4cfdf0e0d4636ad728eeb0ee30557"

[env.production.triggers]
crons = ["0 5 * * *"]
